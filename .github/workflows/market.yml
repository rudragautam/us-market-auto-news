name: US Market News Generator

on:
  workflow_dispatch:

  schedule:
    # Pre-Market: 8:30 AM ET
    - cron: "30 12 * * 1-5"
    - cron: "30 13 * * 1-5"

    # After Open: 10:00 AM ET
    - cron: "0 14 * * 1-5"
    - cron: "0 15 * * 1-5"

    # Mid-Market: 1:00 PM ET
    - cron: "0 17 * * 1-5"
    - cron: "0 18 * * 1-5"

    # After Close: 4:15 PM ET
    - cron: "15 20 * * 1-5"
    - cron: "15 21 * * 1-5"


jobs:

  generate-news:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate US market post
        env:
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py
