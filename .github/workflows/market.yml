name: US Market News Generator

on:
  workflow_dispatch:

  schedule:
    # Pre-market 8:30 ET
    - cron: "30 12 * * 1-5"
    - cron: "30 13 * * 1-5"

    # After open 10:00 ET
    - cron: "0 14 * * 1-5"
    - cron: "0 15 * * 1-5"

    # Mid-market 1:00 ET
    - cron: "0 17 * * 1-5"
    - cron: "0 18 * * 1-5"

    # After close 4:15 ET
    - cron: "15 20 * * 1-5"
    - cron: "15 21 * * 1-5"

permissions:
  contents: write

jobs:
  generate-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate video and upload to YouTube
        env:
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: private
        run: |
          python main.py

      - name: Upload generated output
        uses: actions/upload-artifact@v4
        with:
          name: us-market-news-v2-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 7

      - name: Commit posted-news state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posted_news.json
          git diff --cached --quiet || git commit -m "Update posted news state"
          git push
