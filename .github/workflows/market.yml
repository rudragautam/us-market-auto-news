name: US Market News Generator

on:
  workflow_dispatch:

  schedule:
    - cron: "30 8 * * 1-5"
      timezone: "America/New_York"
    - cron: "0 10 * * 1-5"
      timezone: "America/New_York"
    - cron: "0 13 * * 1-5"
      timezone: "America/New_York"
    - cron: "15 16 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write

jobs:
  generate-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install browser renderer
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Generate and upload YouTube Short
        env:
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: private
          GITHUB_SCHEDULE: ${{ github.event.schedule }}
        run: python main.py

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: us-market-news-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 7

      - name: Commit posted-news state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posted_news.json
          git diff --cached --quiet || git commit -m "Update posted news state"
          git push
