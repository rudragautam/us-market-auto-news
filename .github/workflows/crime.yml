name: Crime Files Long Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1-5"

permissions:
  contents: write

jobs:
  crime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak
          python -m pip install --upgrade pip
          pip install requests google-genai
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Generate crime video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python crime_main.py
      - uses: actions/upload-artifact@v4
        with:
          name: crime-files-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 7
      - name: Commit crime state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crime_state.json
          git diff --cached --quiet || git commit -m "Update crime story state"
          git push
