<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030405;color:#eee;font-family:Arial,sans-serif}.scene{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(circle at 75% 45%,rgba(170,25,35,.24),transparent 30%),linear-gradient(120deg,#020304,#090b0d 50%,#18090b)}.scene:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.95),rgba(0,0,0,.67) 45%,rgba(0,0,0,.30) 78%,rgba(0,0,0,.82)),linear-gradient(0deg,rgba(0,0,0,.9),transparent 32%,rgba(0,0,0,.45))}.frame{position:absolute;inset:18px;border:1px solid #fff3}.frame:after{content:"";position:absolute;inset:7px;border:1px solid #b51f2850}.top{position:absolute;top:36px;left:60px;right:60px;display:flex;justify-content:space-between;letter-spacing:4px;font-size:12px;color:#ddd;z-index:3}.brand{display:flex;gap:13px;align-items:center}.mark{width:31px;height:31px;border:1px solid #b51f28;display:grid;place-items:center;color:#e3484f;transform:rotate(45deg)}.mark span{transform:rotate(-45deg)}.content{position:absolute;left:8vw;bottom:14vh;width:68vw;z-index:3}.kicker{font-size:14px;letter-spacing:6px;color:#e3484f;margin-bottom:18px}.title{font-size:clamp(48px,6vw,94px);line-height:.93;font-weight:700;text-transform:uppercase;text-shadow:0 8px 35px #000;max-width:1100px}.rule{width:115px;height:3px;background:#b51f28;margin:28px 0}.text{font-family:Georgia,serif;font-size:clamp(20px,1.55vw,29px);line-height:1.58;color:#d8d8d2;max-width:1050px}.meta{margin-top:28px;font-size:11px;letter-spacing:5px;color:#999}.scene.intro .content,.scene.outro .content{left:50%;bottom:50%;transform:translate(-50%,50%);text-align:center;width:82vw}.scene.intro .title,.scene.outro .title{font-size:clamp(65px,9vw,140px)}.scene.intro .rule,.scene.outro .rule{margin:30px auto}.scene.intro .text,.scene.outro .text{margin:auto}.quote{position:absolute;right:8vw;bottom:15vh;font:180px Georgia,serif;color:#fff0;z-index:1}
</style></head><body><main id="app"></main><script>
const story=__STORY_JSON__;
const app=document.getElementById("app");
const scenes=[{type:"intro",chapter:"CRIME FILES",title:story.title,text:story.hook},...(story.scenes||[]).map((s,i)=>({type:"story",chapter:`CASE BEAT // ${String(i+1).padStart(2,"0")}`,title:s.beat,text:s.visual+" "+s.on_screen})),{type:"outro",chapter:"CASE FILE CLOSED",title:"THE TRAIL REMAINS",text:"This story was built from the cited primary-source material. Allegations and court findings are presented as described in the source."}];
app.innerHTML=scenes.map((s,i)=>`<section class="scene ${s.type}"><div class="frame"></div><div class="top"><div class="brand"><div class="mark"><span>CF</span></div><span>CRIME FILES</span></div><span>${String(i+1).padStart(2,"0")} / ${scenes.length}</span></div><div class="content"><div class="kicker">${s.chapter}</div><div class="title">${escapeHtml(s.title)}</div><div class="rule"></div><div class="text" id="text-${i}"></div><div class="meta">A CINEMATIC CASE FILE</div></div><div class="quote">“</div></section>`).join("");
function escapeHtml(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
async function run(){for(let i=0;i<scenes.length;i++){const el=document.getElementById("text-"+i),t=scenes[i].text||"";el.textContent="";for(let n=0;n<=t.length;n+=Math.max(1,Math.ceil(t.length/90))){el.textContent=t.slice(0,n);await new Promise(r=>setTimeout(r,55));}await new Promise(r=>setTimeout(r,1800));}}
run();
</script></body></html>
